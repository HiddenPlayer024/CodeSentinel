name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.14'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
        pip install pytest typer
        
    - name: Run pytest
      run: |
        PYTHONPATH=. pytest tests/
        
    - name: Run Evaluation
      run: |
        PYTHONPATH=. python scripts/evaluate_security_corpus.py --provider mock
