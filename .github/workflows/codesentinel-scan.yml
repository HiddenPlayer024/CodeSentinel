name: CodeSentinel Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  codesentinel-scan:
    name: Run CodeSentinel
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install CodeSentinel
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run CodeSentinel Scan (SARIF output)
      run: |
        codesentinel scan . -f sarif -o codesentinel-results.sarif --fail-on CRITICAL
        
    - name: Run CodeSentinel AI Verification (Optional)
      if: env.OPENAI_API_KEY != ''
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: |
        # This step overwrites the SARIF with AI-verified results if API key is present
        codesentinel scan . -f sarif -o codesentinel-results.sarif --fail-on CRITICAL --ai --ai-provider openai
      continue-on-error: true

    - name: Upload SARIF to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: codesentinel-results.sarif
        category: codesentinel
